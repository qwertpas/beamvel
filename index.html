<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f2ed" />
    <title>Beam Velocity</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="panel">
      <div class="toolbar">
        <label class="distance">
          <span>Distance</span>
          <span class="input-wrap">
            <input id="distance" type="number" min="0.001" step="0.1" value="100" inputmode="decimal" />
            <span>mm</span>
          </span>
        </label>
        <div class="direction" role="group" aria-label="Accepted direction">
          <button class="direction-option" type="button" data-direction="12">1→2</button>
          <button class="direction-option" type="button" data-direction="21">2→1</button>
          <button class="direction-option active" type="button" data-direction="both">Both</button>
        </div>
        <button id="connect" type="button">
          <span class="connection-dot"></span>
          <span class="connection-label">Connect</span>
        </button>
      </div>

      <section class="sensors" aria-label="Beam states">
        <div class="sensor" id="sensor1">
          <span class="sensor-dot"></span>
          <span>1</span>
          <strong>—</strong>
        </div>
        <div class="sensor" id="sensor2">
          <span class="sensor-dot"></span>
          <span>2</span>
          <strong>—</strong>
        </div>
      </section>

      <output class="velocity" aria-live="polite">
        <span id="velocity">—</span>
        <small>m/s</small>
      </output>

      <section class="trials">
        <div class="trial-actions">
          <button id="save" type="button" disabled>Save</button>
          <button id="copy" type="button">Copy</button>
          <button id="clear" type="button" disabled>Clear</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Velocity</th>
                <th>Notes</th>
              </tr>
            </thead>
            <tbody id="trial-rows"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="app.js?v=10"></script>
  </body>
</html>
