<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3f2ed" />
    <link rel="icon" href="data:," />
    <title>Beam Velocity</title>
    <link rel="stylesheet" href="style.css?v=18" />
  </head>
  <body>
    <main class="panel">
      <div class="toolbar">
        <label class="distance">
          <span>Spacing</span>
          <span class="input-wrap">
            <input id="distance" type="number" min="0.001" step="0.1" value="50" inputmode="decimal" />
            <span>mm</span>
          </span>
        </label>
        <div class="direction" role="group" aria-label="Accepted direction">
          <button class="direction-option" type="button" data-direction="15">1→5</button>
          <button class="direction-option" type="button" data-direction="51">5→1</button>
          <button class="direction-option active" type="button" data-direction="both">Both</button>
        </div>
        <button id="connect" type="button">
          <span class="connection-dot"></span>
          <span class="connection-label">Connect</span>
        </button>
      </div>

      <div class="motion">
        <label class="checkbox vertical"><input id="vertical" type="checkbox" />Vertical</label>
        <label class="checkbox vertical"><input id="up-down" type="checkbox" disabled />Up &amp; down</label>
      </div>

      <section class="sensors" aria-label="Beam states">
        <div class="sensor" id="sensor1">
          <span class="sensor-dot"></span>
          <span>1</span>
          <strong>—</strong>
        </div>
        <div class="sensor" id="sensor2">
          <span class="sensor-dot"></span>
          <span>2</span>
          <strong>—</strong>
        </div>
        <div class="sensor" id="sensor3">
          <span class="sensor-dot"></span><span>3</span><strong>—</strong>
        </div>
        <div class="sensor" id="sensor4">
          <span class="sensor-dot"></span><span>4</span><strong>—</strong>
        </div>
        <div class="sensor" id="sensor5">
          <span class="sensor-dot"></span><span>5</span><strong>—</strong>
        </div>
      </section>

      <output class="velocity" aria-live="polite">
        <span id="velocity">—</span>
        <small>m/s</small>
      </output>

      <svg id="plot" viewBox="0 0 640 220" role="img" aria-label="Position versus time; waiting for a complete trial"></svg>

      <label class="checkbox"><input id="save-points" type="checkbox" checked />Save spacing &amp; timestamps</label>
      <section class="trials">
        <div class="trial-actions">
          <button id="save" type="button" disabled>Save</button>
          <button id="copy" type="button">Copy</button>
          <button id="export" type="button" disabled>Export CSV</button>
          <button id="clear" type="button" disabled>Clear</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Velocity</th>
                <th>Notes</th>
                <th>Vertical</th>
                <th>Spacing (mm)</th>
                <th>Sensor 1 (ms)</th>
                <th>Sensor 2 (ms)</th>
                <th>Sensor 3 (ms)</th>
                <th>Sensor 4 (ms)</th>
                <th>Sensor 5 (ms)</th>
                <th>Return 1 (ms)</th>
                <th>Return 2 (ms)</th>
                <th>Return 3 (ms)</th>
                <th>Return 4 (ms)</th>
                <th>Return 5 (ms)</th>
                <th>First crossing (UTC)</th>
              </tr>
            </thead>
            <tbody id="trial-rows"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="app.js?v=18"></script>
  </body>
</html>
